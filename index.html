<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08091a"><title>Neon Escape</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08091a;color:#fff;font:16px system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:env(safe-area-inset-top,12px);left:16px;right:16px;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 0 12px #00eaff;pointer-events:none}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#08091ad9;text-align:center;padding:20px}h1{font-size:clamp(36px,10vw,62px);letter-spacing:3px;color:#45f5ff;text-shadow:0 0 22px #00dfff;margin:0 0 10px}p{line-height:1.5;max-width:320px;color:#cdd0ed}button{border:1px solid #45f5ff;background:#15163d;color:#fff;border-radius:14px;padding:15px 30px;font-size:18px;font-weight:700;margin:8px;box-shadow:0 0 15px #00b7ff70}#share{display:none}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="score">Очки: 0</span><span id="lives">♥ ♥ ♥</span></div><div id="overlay"><h1>NEON ESCAPE</h1><p id="message">Управляй кораблём пальцем. Уклоняйся от красных блоков и собирай голубые кристаллы.</p><button id="start">ИГРАТЬ</button><button id="share">ПОДЕЛИТЬСЯ</button></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),start=document.getElementById('start'),share=document.getElementById('share');let W,H,dpr,player,objects=[],particles=[],score=0,lives=3,playing=false,last=0,spawn=0,invuln=0,elapsed=0,raf=0;const bestKey='neon-escape-best';let best=Number(localStorage.getItem(bestKey)||0);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player)player.x=Math.max(25,Math.min(W-25,player.x))}addEventListener('resize',resize);resize();function begin(){player={x:W/2,y:H*.82,r:17,target:W/2};objects=[];particles=[];score=0;lives=3;elapsed=0;spawn=0;invuln=0;last=0;playing=true;overlay.style.display='none';scoreEl.textContent='Очки: 0';livesEl.textContent='♥ ♥ ♥';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function end(){playing=false;best=Math.max(best,Math.floor(score));localStorage.setItem(bestKey,best);message.textContent=`Твой счёт: ${Math.floor(score)} · Рекорд: ${best}`;start.textContent='ИГРАТЬ СНОВА';share.style.display='block';overlay.style.display='flex'}function move(x){if(player)player.target=Math.max(22,Math.min(W-22,x))}c.addEventListener('pointerdown',e=>move(e.clientX));c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});addEventListener('keydown',e=>{if(!playing)return;if(e.key==='ArrowLeft'||e.key==='a')move(player.target-65);if(e.key==='ArrowRight'||e.key==='d')move(player.target+65)});start.onclick=begin;share.onclick=()=>{const text=`Я набрал ${Math.floor(score)} очков в Neon Escape!`;if(navigator.share)navigator.share({title:'Neon Escape',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>{share.textContent='СКОПИРОВАНО'})};function collision(a,b){return Math.abs(a.x-b.x)<a.r+b.r*.8&&Math.abs(a.y-b.y)<a.r+b.r*.8}function loop(t){if(!playing)return;const dt=Math.min((t-last)/1000||0,.035);last=t;elapsed+=dt;invuln=Math.max(0,invuln-dt);score+=dt*10;player.x+=(player.target-player.x)*Math.min(1,dt*15);spawn-=dt;if(spawn<=0){const crystal=Math.random()<.27;objects.push({x:25+Math.random()*(W-50),y:-25,r:crystal?12:18+Math.random()*10,type:crystal?'gem':'block',speed:180+Math.min(280,elapsed*5)});spawn=Math.max(.26,.72-elapsed*.006)}for(const o of objects){o.y+=o.speed*dt;if(!o.hit&&collision(player,o)){o.hit=true;if(o.type==='gem'){score+=50}else if(invuln<=0){lives--;invuln=1.1;if(lives<=0){end();break}}}}objects=objects.filter(o=>!o.hit&&o.y<H+50);scoreEl.textContent='Очки: '+Math.floor(score);livesEl.textContent='♥ '.repeat(lives);render(t);if(playing)raf=requestAnimationFrame(loop)}function render(t=0){ctx.fillStyle='#08091a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#18234c';ctx.lineWidth=1;const step=48,offset=(elapsed*90)%step;for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=offset;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const o of objects){ctx.save();ctx.shadowBlur=20;ctx.shadowColor=o.type==='gem'?'#38f8ff':'#ff2e7a';ctx.fillStyle=o.type==='gem'?'#38f8ff':'#ff2e7a';ctx.translate(o.x,o.y);if(o.type==='gem'){ctx.rotate(Math.PI/4);ctx.fillRect(-o.r*.7,-o.r*.7,o.r*1.4,o.r*1.4)}else ctx.fillRect(-o.r,-o.r,o.r*2,o.r*2);ctx.restore()}if(player){ctx.save();ctx.translate(player.x,player.y);ctx.globalAlpha=invuln>0&&Math.floor(t/100)%2?0.35:1;ctx.shadowBlur=24;ctx.shadowColor='#42eaff';ctx.fillStyle='#4ef5ff';ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(-19,20);ctx.lineTo(0,11);ctx.lineTo(19,20);ctx.closePath();ctx.fill();ctx.restore()}}render();
</script></body></html>
