name: Publish Cosmic Rave Mini App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cosmic-rave-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable site and 3D game
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare complete static site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='node_modules/' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/cosmic-rave-v2/index.html
          test -s _site/cosmic-rave-v2/src/app.js
          test -s _site/cosmic-rave-v2/assets/audio/vitty-track.json
          test -s _site/makar-zhenya-soundtrack.mp3
          echo "Stable 3D game and audio asset verified."
      - name: Bundle a first-party copy of the Three.js engine
        run: |
          # Avoid third-party CDN failures in Telegram WebViews / mobile networks.
          # Keep all 3D modules on the same HTTPS origin as the game.
          npm install --prefix /tmp/cosmic-rave-vendor --no-save --no-package-lock --ignore-scripts --no-audit --no-fund three@0.160.1
          mkdir -p _site/cosmic-rave-v2/vendor/three/build _site/cosmic-rave-v2/vendor/three/examples
          cp /tmp/cosmic-rave-vendor/node_modules/three/build/three.module.js _site/cosmic-rave-v2/vendor/three/build/
          cp -a /tmp/cosmic-rave-vendor/node_modules/three/examples/jsm _site/cosmic-rave-v2/vendor/three/examples/
          test -s _site/cosmic-rave-v2/vendor/three/build/three.module.js
          test -s _site/cosmic-rave-v2/vendor/three/examples/jsm/postprocessing/EffectComposer.js
          test -s _site/cosmic-rave-v2/vendor/three/examples/jsm/loaders/GLTFLoader.js
          echo "Three.js 0.160.1 is now bundled with the game."
      - name: Verify browser JavaScript and Mini App routes
        run: |
          for file in _site/cosmic-rave-v2/src/*.js; do
            node --check --input-type=module < "$file"
          done
          node --check _site/cosmic-rave-v2/src/bootstrap.js
          test -s _site/cosmic-rave-v2/assets/models/raver.glb
          test -s _site/makar-zhenya-soundtrack.mp3
          grep -q 'vendor/three/build/three.module.js' _site/cosmic-rave-v2/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
